openapi: 3.0.3
info:
  description: Curated OpenAPI SSOT for @ratary/sdk generation (Phase 16). Full spec
    at GET /docs/json.
  title: Ratary API — SDK v1 surface
  version: 1.2.3
servers:
- url: http://localhost:9876/api/v1
security:
- BearerAuth: []
- ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: OK
      security: []
      tags:
      - Health
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Capability manifest
      security: []
      tags:
      - Capabilities
  /capabilities/negotiate:
    post:
      operationId: negotiateCapabilities
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCapabilityRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityNegotiationResult"
          description: Negotiation result matrix
      security: []
      tags:
      - Capabilities
  /ecosystem/clients:
    get:
      operationId: listEcosystemClients
      responses:
        "200":
          description: Client catalog
      security: []
      tags:
      - Ecosystem
  /ecosystem/clients/{type}:
    get:
      operationId: getEcosystemClient
      parameters:
      - explode: false
        in: path
        name: type
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Client profile
      security: []
      tags:
      - Ecosystem
  /memory:
    get:
      operationId: listMemories
      parameters:
      - explode: true
        in: query
        name: project
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          description: Memory list
      tags:
      - Memory
    post:
      operationId: createMemory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryRequest"
        required: true
      responses:
        "201":
          description: Created memory
      tags:
      - Memory
  /memory/{id}:
    delete:
      operationId: deleteMemory
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Deleted
      tags:
      - Memory
    get:
      operationId: getMemory
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: Memory
      tags:
      - Memory
    put:
      operationId: updateMemory
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryRequest"
      responses:
        "200":
          description: Updated memory
      tags:
      - Memory
  /search:
    get:
      operationId: searchMemories
      parameters:
      - explode: true
        in: query
        name: q
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          description: Search results
      tags:
      - Search
  /context:
    post:
      operationId: buildContext
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildContextRequest"
        required: true
      responses:
        "200":
          description: Context bundle
      tags:
      - Context
  /context/packages/{packageId}:
    get:
      operationId: getContextPackageLifecycle
      parameters:
      - explode: false
        in: path
        name: packageId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPackageLifecycle"
          description: Lifecycle record
      summary: Get Context Package lifecycle state (ADR-1013)
      tags:
      - Context
  /context/packages/{packageId}/retire:
    post:
      operationId: retireContextPackage
      parameters:
      - explode: false
        in: path
        name: packageId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPackageLifecycle"
          description: Updated lifecycle record
      summary: Retire Context Package (active → retired)
      tags:
      - Context
  /context/packages/{packageId}/archive:
    post:
      operationId: archiveContextPackage
      parameters:
      - explode: false
        in: path
        name: packageId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPackageLifecycle"
          description: Updated lifecycle record
      summary: Archive Context Package (active|retired → archived)
      tags:
      - Context
  /governance/manifest:
    get:
      operationId: getGovernanceManifest
      responses:
        "200":
          description: Governance manifest registry
      summary: Memory governance manifest (ADR-1020 / ADR-1021)
      tags:
      - Governance
  /governance/stewardship/runs:
    get:
      operationId: listStewardshipRuns
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          description: Stewardship runs
      summary: List stewardship run history for authenticated owner
      tags:
      - Governance
  /governance/stewardship/runs/{runId}:
    get:
      operationId: getStewardshipRun
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Stewardship run
      summary: Stewardship run detail
      tags:
      - Governance
  /governance/exceptions:
    get:
      operationId: listGovernanceExceptions
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listGovernanceExceptions_200_response"
          description: Exception list
      summary: List governance exception requests (PI-1027-B / ADR-1029)
      tags:
      - Governance
    post:
      operationId: createGovernanceExceptionRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGovernanceExceptionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createGovernanceExceptionRequest_201_response"
          description: Created exception request
      summary: Create exception request (pending — no auto-approve)
      tags:
      - Governance
  /governance/exceptions/{exceptionId}:
    get:
      operationId: getGovernanceException
      parameters:
      - explode: false
        in: path
        name: exceptionId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createGovernanceExceptionRequest_201_response"
          description: Exception detail
      summary: Governance exception request detail
      tags:
      - Governance
  /governance/denials:
    get:
      operationId: listPolicyDenials
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listPolicyDenials_200_response"
          description: Denial events
      summary: List policy denial events (PI-1027-C / ADR-1028 D4)
      tags:
      - Governance
  /governance/denials/summary:
    get:
      operationId: getPolicyDenialSummary
      parameters:
      - explode: true
        in: query
        name: since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getPolicyDenialSummary_200_response"
          description: Denial summary
      summary: Aggregated denial counts by evaluation point
      tags:
      - Governance
  /decisions/models:
    get:
      operationId: listDecisionModels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionModelCatalogResponse"
          description: Authorized decision model catalog
        "401":
          description: Unauthorized
      summary: List owner-authorized declarative decision models (PI-P6-D0)
      tags:
      - Decision Intelligence
  /decisions/recommendations:
    post:
      operationId: fetchRecommendations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchRecommendationsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchRecommendationsResponse"
          description: Advisory cards
      summary: Advisory recommendation cards from recall trace (PI-P6-B / ADR-1042)
      tags:
      - Decision Intelligence
  /decisions/provenance:
    post:
      operationId: recordDecisionProvenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDecisionProvenanceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/recordDecisionProvenance_201_response"
          description: Provenance record
        "404":
          description: Decision provenance disabled
        "503":
          description: Provenance store unavailable
      summary: "Record human Accept/Reject provenance (ADR-069, flag-gated)"
      tags:
      - Decision Intelligence
  /federation/peers:
    get:
      operationId: listFederationPeers
      responses:
        "200":
          description: Peer list
      tags:
      - Federation
components:
  schemas:
    Memory:
      properties:
        id:
          format: uuid
          type: string
        title:
          type: string
        content:
          type: string
        summary:
          type: string
        project:
          type: string
        tags:
          items:
            type: string
          type: array
        favorite:
          type: boolean
        archived:
          type: boolean
        lifecycleState:
          description: Optional stewardship lifecycle hint when set
          enum:
          - active
          - stale
          - candidate_compress
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    CreateMemoryRequest:
      example:
        title: title
        content: content
        summary: summary
        project: project
        tags:
        - tags
        - tags
      properties:
        title:
          type: string
        content:
          type: string
        summary:
          type: string
        project:
          type: string
        tags:
          items:
            type: string
          type: array
      required:
      - content
      - title
      type: object
    UpdateMemoryRequest:
      example:
        title: title
        content: content
        summary: summary
        tags:
        - tags
        - tags
      properties:
        title:
          type: string
        content:
          type: string
        summary:
          type: string
        tags:
          items:
            type: string
          type: array
      type: object
    BuildContextRequest:
      example:
        task: task
        maxTokens: 0
        project: project
      properties:
        task:
          type: string
        maxTokens:
          type: integer
        project:
          type: string
      required:
      - task
      type: object
    BuildContextResponse:
      properties:
        context:
          type: string
        prompt:
          type: string
        system:
          type: string
        user:
          type: string
        memoryCount:
          type: integer
        packageId:
          description: ADR-1011 Ratary-issued Context Package id
          type: string
        ownerId:
          type: string
        createdAt:
          format: date-time
          type: string
        confidence:
          enum:
          - high
          - medium
          - low
          type: string
        confidenceModel:
          description: ADR-1016 confidence derivation model id
          enum:
          - heuristic-top-relevance-v1
          - confidence-product-v1
          type: string
        updateMechanism:
          type: string
        lifecycleState:
          description: ADR-1013 usage eligibility; mint is always active
          enum:
          - active
          - retired
          - archived
          type: string
        sourceLabels:
          items:
            type: string
          type: array
        query:
          type: string
        retrievalMemo:
          description: ADR-1018 ranked-candidate memo status; package envelope always
            reminted
          enum:
          - hit
          - miss
          - bypass
          type: string
      type: object
    ContextPackageLifecycle:
      example:
        packageId: packageId
        ownerId: ownerId
        lifecycleState: active
        createdAt: 2000-01-23T04:56:07.000+00:00
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        packageId:
          type: string
        ownerId:
          type: string
        lifecycleState:
          enum:
          - active
          - retired
          - archived
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - createdAt
      - lifecycleState
      - ownerId
      - packageId
      - updatedAt
      type: object
    ClientCapabilityRequest:
      example:
        protocolVersion: protocolVersion
        clientInfo:
          name: name
          version: version
        requiredCapabilities:
        - requiredCapabilities
        - requiredCapabilities
        preferredCapabilities:
        - preferredCapabilities
        - preferredCapabilities
        transports:
        - transports
        - transports
      properties:
        protocolVersion:
          type: string
        clientInfo:
          $ref: "#/components/schemas/ClientCapabilityRequest_clientInfo"
        requiredCapabilities:
          items:
            type: string
          type: array
        preferredCapabilities:
          items:
            type: string
          type: array
        transports:
          items:
            type: string
          type: array
      type: object
    CapabilityMatchGroups:
      example:
        required:
        - required
        - required
        preferred:
        - preferred
        - preferred
        transports:
        - transports
        - transports
      properties:
        required:
          items:
            type: string
          type: array
        preferred:
          items:
            type: string
          type: array
        transports:
          items:
            type: string
          type: array
      required:
      - preferred
      - required
      - transports
      type: object
    CapabilityNegotiationResult:
      example:
        compatible: true
        negotiatedProtocolVersion: negotiatedProtocolVersion
        serverProtocolVersion: serverProtocolVersion
        supportedProtocolVersions:
        - supportedProtocolVersions
        - supportedProtocolVersions
        matched:
          required:
          - required
          - required
          preferred:
          - preferred
          - preferred
          transports:
          - transports
          - transports
        missing:
          required:
          - required
          - required
          preferred:
          - preferred
          - preferred
          transports:
          - transports
          - transports
        serverEnabledCapabilities:
        - serverEnabledCapabilities
        - serverEnabledCapabilities
        capabilitiesUrl: capabilitiesUrl
        negotiateUrl: negotiateUrl
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        compatible:
          type: boolean
        negotiatedProtocolVersion:
          type: string
        serverProtocolVersion:
          type: string
        supportedProtocolVersions:
          items:
            type: string
          type: array
        matched:
          $ref: "#/components/schemas/CapabilityMatchGroups"
        missing:
          $ref: "#/components/schemas/CapabilityMatchGroups"
        serverEnabledCapabilities:
          items:
            type: string
          type: array
        capabilitiesUrl:
          type: string
        negotiateUrl:
          type: string
        timestamp:
          format: date-time
          type: string
      required:
      - capabilitiesUrl
      - compatible
      - matched
      - missing
      - negotiateUrl
      - negotiatedProtocolVersion
      - serverEnabledCapabilities
      - serverProtocolVersion
      - supportedProtocolVersions
      - timestamp
      type: object
    GovernanceExceptionRecord:
      example:
        exceptionId: exceptionId
        ownerId: ownerId
        exceptionClass: decay_protection
        rationale: rationale
        status: pending
        requestedBy: requestedBy
        requestedAt: 2000-01-23T04:56:07.000+00:00
        expiresAt: 2000-01-23T04:56:07.000+00:00
        auditLog:
        - at: 2000-01-23T04:56:07.000+00:00
          action: action
          actor: actor
          note: note
        - at: 2000-01-23T04:56:07.000+00:00
          action: action
          actor: actor
          note: note
      properties:
        exceptionId:
          type: string
        ownerId:
          type: string
        exceptionClass:
          enum:
          - decay_protection
          - feature_flag_off
          - ops_maintenance
          type: string
        rationale:
          type: string
        status:
          enum:
          - pending
          - approved
          - rejected
          - expired
          type: string
        requestedBy:
          type: string
        requestedAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        auditLog:
          items:
            $ref: "#/components/schemas/GovernanceExceptionRecord_auditLog_inner"
          type: array
      required:
      - auditLog
      - exceptionClass
      - exceptionId
      - ownerId
      - rationale
      - requestedAt
      - requestedBy
      - status
      type: object
    CreateGovernanceExceptionRequest:
      example:
        exceptionClass: decay_protection
        rationale: rationale
        expiresAt: 2000-01-23T04:56:07.000+00:00
      properties:
        exceptionClass:
          enum:
          - decay_protection
          - feature_flag_off
          - ops_maintenance
          type: string
        rationale:
          maxLength: 4000
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
      - exceptionClass
      - rationale
      type: object
    PolicyDenialEvent:
      example:
        denialId: denialId
        ownerId: ownerId
        point: write
        policyModuleId: policyModuleId
        reasonCode: reasonCode
        occurredAt: 2000-01-23T04:56:07.000+00:00
        memoryId: memoryId
        resource: resource
      properties:
        denialId:
          type: string
        ownerId:
          type: string
        point:
          enum:
          - write
          - recall
          - stewardship
          type: string
        policyModuleId:
          type: string
        reasonCode:
          type: string
        occurredAt:
          format: date-time
          type: string
        memoryId:
          type: string
        resource:
          type: string
      required:
      - denialId
      - occurredAt
      - ownerId
      - point
      - reasonCode
      type: object
    PolicyDenialSummary:
      example:
        since: 2000-01-23T04:56:07.000+00:00
        byPoint:
          write: 0
          recall: 6
          stewardship: 1
        total: 5
      properties:
        since:
          format: date-time
          type: string
        byPoint:
          $ref: "#/components/schemas/PolicyDenialSummary_byPoint"
        total:
          type: integer
      required:
      - byPoint
      - since
      - total
      type: object
    RecommendationCard:
      example:
        cardId: cardId
        title: title
        advisory: true
        memoryId: memoryId
        sourceReference: sourceReference
        confidence: 0.8008281904610115
        computedScore: 6.027456183070403
        evidenceRefs:
        - evidenceRefs
        - evidenceRefs
        reason: reason
      properties:
        cardId:
          type: string
        title:
          type: string
        advisory:
          type: boolean
        memoryId:
          type: string
        sourceReference:
          type: string
        confidence:
          type: number
        computedScore:
          description: PI-P6-D1.1 sandbox score when re-rank applied
          type: number
        evidenceRefs:
          items:
            type: string
          type: array
        reason:
          type: string
      required:
      - advisory
      - cardId
      - evidenceRefs
      - reason
      - sourceReference
      - title
      type: object
    RecommendationRerankMetadata:
      example:
        applied: true
        decisionModelId: decisionModelId
        decisionModelVersion: decisionModelVersion
        sandboxOutcome: ok
        pluginDigestPrefix: pluginDigestPrefix
        reason: reason
      properties:
        applied:
          type: boolean
        decisionModelId:
          type: string
        decisionModelVersion:
          type: string
        sandboxOutcome:
          enum:
          - ok
          - timeout
          - error
          - denied
          - disabled
          type: string
        pluginDigestPrefix:
          type: string
        reason:
          type: string
      required:
      - applied
      type: object
    FetchRecommendationsRequest:
      example:
        query: query
        limit: 0
        decisionModelId: decisionModelId
        decisionModelVersion: decisionModelVersion
      properties:
        query:
          type: string
        limit:
          maximum: 10
          type: integer
        decisionModelId:
          description: Optional PI-P6-D1.1 computed model for re-rank
          type: string
        decisionModelVersion:
          type: string
      required:
      - query
      type: object
    FetchRecommendationsResponse:
      example:
        traceId: traceId
        cards:
        - cardId: cardId
          title: title
          advisory: true
          memoryId: memoryId
          sourceReference: sourceReference
          confidence: 0.8008281904610115
          computedScore: 6.027456183070403
          evidenceRefs:
          - evidenceRefs
          - evidenceRefs
          reason: reason
        - cardId: cardId
          title: title
          advisory: true
          memoryId: memoryId
          sourceReference: sourceReference
          confidence: 0.8008281904610115
          computedScore: 6.027456183070403
          evidenceRefs:
          - evidenceRefs
          - evidenceRefs
          reason: reason
        advisory: true
        rerank:
          applied: true
          decisionModelId: decisionModelId
          decisionModelVersion: decisionModelVersion
          sandboxOutcome: ok
          pluginDigestPrefix: pluginDigestPrefix
          reason: reason
      properties:
        traceId:
          type: string
        cards:
          items:
            $ref: "#/components/schemas/RecommendationCard"
          type: array
        advisory:
          type: boolean
        rerank:
          $ref: "#/components/schemas/RecommendationRerankMetadata"
      required:
      - advisory
      - cards
      - traceId
      type: object
    CreateDecisionProvenanceRequest:
      example:
        briefId: briefId
        packageId: packageId
        verdict: accepted
        rationale: rationale
        sourceMemoryIds:
        - sourceMemoryIds
        - sourceMemoryIds
        decisionModelId: decisionModelId
        decisionModelVersion: decisionModelVersion
        decisionModelPluginDigest: decisionModelPluginDigest
        sandboxOutcome: ok
      properties:
        briefId:
          type: string
        packageId:
          type: string
        verdict:
          enum:
          - accepted
          - rejected
          type: string
        rationale:
          maxLength: 4000
          type: string
        sourceMemoryIds:
          items:
            type: string
          type: array
        decisionModelId:
          type: string
        decisionModelVersion:
          type: string
        decisionModelPluginDigest:
          type: string
        sandboxOutcome:
          enum:
          - ok
          - timeout
          - error
          - denied
          - disabled
          type: string
      required:
      - briefId
      - verdict
      type: object
    DecisionModelComputedPluginSummary:
      example:
        kind: worker
        artifactDigestPrefix: artifactDigestPrefix
      properties:
        kind:
          enum:
          - worker
          type: string
        artifactDigestPrefix:
          type: string
      required:
      - artifactDigestPrefix
      - kind
      type: object
    DecisionModelCatalogEntry:
      example:
        id: id
        version: version
        displayName: displayName
        description: description
        stability: experimental
        executionProfileName: executionProfileName
        capabilities:
